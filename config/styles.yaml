# 翻译风格配置

styles:
  # 通用风格
  general:
    name: "通用风格"
    description: "适用于一般场景的标准翻译"
    guidelines:
      - "忠实原文，准确传达意思"
      - "表达清晰，符合目标语言习惯"
      - "用词适中，不过于正式或口语化"
    temperature: 0.3
    
  # 地道风格
  native:
    name: "地道风格"
    description: "追求自然地道的本地化表达"
    guidelines:
      - "使用地道的本地表达方式"
      - "避免翻译腔，追求自然流畅"
      - "可以适当意译，但保持核心意思"
      - "使用目标语言的常用表达和俗语"
    temperature: 0.4
    examples:
      - "It's raining cats and dogs → 下着倾盆大雨（而非：猫和狗从天上掉下来）"
      - "Break a leg → 祝你好运（而非：打断一条腿）"
  
  # 商务风格
  business:
    name: "商务风格"
    description: "适用于商业文档、合同、报告等"
    guidelines:
      - "使用正式、专业的商务用语"
      - "术语准确，符合行业规范"
      - "表达严谨，避免歧义"
      - "保持客观、中立的语气"
      - "常用词汇：协议、条款、责任、义务、权利等"
    temperature: 0.2
    terminology:
      company: "公司/企业"
      contract: "合同"
      agreement: "协议"
      revenue: "营收/收益"
      profit: "利润"
      stakeholder: "利益相关方"
  
  # 学术风格
  academic:
    name: "学术风格"
    description: "适用于学术论文、研究报告等"
    guidelines:
      - "使用学术规范用语"
      - "专业术语准确，统一"
      - "表达严谨，逻辑清晰"
      - "保持客观、学术的语气"
      - "避免口语化表达"
      - "常用词汇：研究、分析、表明、证明、提出、假设等"
    temperature: 0.2
    terminology:
      research: "研究"
      study: "研究"
      analysis: "分析"
      hypothesis: "假设"
      methodology: "方法论"
      experiment: "实验"
      result: "结果"
      conclusion: "结论"
  
  # 技术文档风格
  technical:
    name: "技术文档风格"
    description: "适用于技术文档、API文档、说明书等"
    guidelines:
      - "技术术语统一且准确"
      - "表达简洁明确"
      - "使用祈使句和陈述句"
      - "保留代码、命令等技术内容不翻译"
      - "常用词汇：配置、安装、运行、调试等"
    temperature: 0.2
    keep_untranslated:
      - "代码块"
      - "命令行"
      - "API名称"
      - "变量名"
  
  # 文学风格
  literary:
    name: "文学风格"
    description: "适用于文学作品、小说、诗歌等"
    guidelines:
      - "注重文学性和艺术性"
      - "保持原作的风格和韵味"
      - "可以适当创造性翻译"
      - "注意修辞手法的转换"
      - "考虑文化差异和读者接受度"
    temperature: 0.5
  
  # 新闻风格
  news:
    name: "新闻风格"
    description: "适用于新闻报道、时事评论等"
    guidelines:
      - "客观、中立、准确"
      - "简洁明了，突出重点"
      - "使用新闻常用表达"
      - "保持时效性用语"
      - "常用词汇：报道、消息、据悉、获悉等"
    temperature: 0.3
  
  # 口语风格
  colloquial:
    name: "口语风格"
    description: "适用于日常对话、聊天等"
    guidelines:
      - "使用口语化表达"
      - "自然、随意、亲切"
      - "可以使用网络用语、流行语"
      - "避免过于正式的表达"
      - "常用词汇：哈哈、嗯、哦、哇等"
    temperature: 0.5
  
  # 法律风格
  legal:
    name: "法律风格"
    description: "适用于法律文件、合同、条款等"
    guidelines:
      - "使用法律专业术语"
      - "表达精确、严谨、无歧义"
      - "保持正式、庄重的语气"
      - "遵循法律文书规范"
      - "常用词汇：根据、依照、应当、不得、违反等"
    temperature: 0.1
    terminology:
      party: "当事人/一方"
      clause: "条款"
      provision: "规定"
      obligation: "义务"
      liability: "责任"
      breach: "违约"

# 默认风格
default_style: "general"

# 风格选择建议
recommendations:
  technology_content: "technical"
  business_document: "business"
  academic_paper: "academic"
  daily_conversation: "colloquial"
  news_article: "news"
  legal_document: "legal"
  literature: "literary"

