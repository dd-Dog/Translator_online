# 大模型配置
models:
  # OpenAI (用于Planner, Checker, Aggregator) - 已禁用，使用免费模型
  # 通过OpenRouter调用（国内可用）
  openai:
    enabled: false
    provider: "openai"
    model: "gpt-4"  # OpenRouter会自动转换为 openai/gpt-4 (gpt-3.5-turbo在某些地区不可用)
    api_key_env: "OPENROUTER_API_KEY"  # 使用OpenRouter API密钥
    base_url: "https://openrouter.ai/api/v1"
    use_openrouter: true
    params:
      temperature: 0.3
      max_tokens: 2000
      http_referer: "https://github.com/dd-Dog/Translator_online"
      x_title: "Translator Agent"
  
  # Gemini (用于Translator-A主译) - 已禁用，使用免费模型
  # 通过OpenRouter调用（国内可用）
  gemini:
    enabled: false
    provider: "gemini"
    model: "google/gemini-2.5-flash"  # OpenRouter模型ID，也可用 google/gemini-2.5-pro
    api_key_env: "OPENROUTER_API_KEY"  # 使用OpenRouter API密钥
    base_url: "https://openrouter.ai/api/v1"
    use_openrouter: true
    params:
      temperature: 0.3
      http_referer: "https://github.com/dd-Dog/Translator_online"
      x_title: "Translator Agent"
  
  # Qwen (用于Translator-B对照译和Stylist)
  # 支持多个模型：qwen-turbo（免费额度）, qwen-plus, qwen-max
  qwen:
    enabled: true
    provider: "qwen"
    model: "qwen-turbo"  # 免费模型：qwen-turbo, 付费：qwen-plus, qwen-max
    api_key_env: "QWEN_API_KEY"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    params:
      temperature: 0.4
      max_tokens: 2000
  
  # Qwen Plus (可选，更高质量)
  qwen_plus:
    enabled: true
    provider: "qwen"
    model: "qwen-plus"  # 付费模型，质量更高
    api_key_env: "QWEN_API_KEY"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    params:
      temperature: 0.4
      max_tokens: 2000
  
  # DeepSeek (用于Planner, Checker, Aggregator, Translator-A)
  # 支持多个模型：deepseek-chat（免费）, deepseek-reasoner（推理模型）
  deepseek:
    enabled: true
    provider: "deepseek"
    model: "deepseek-chat"  # 免费模型
    api_key_env: "DEEPSEEK_API_KEY"
    base_url: "https://api.deepseek.com"
    params:
      temperature: 0.3
      max_tokens: 2000
  
  # DeepSeek V3 (可选，更高质量)
  deepseek_v3:
    enabled: true
    provider: "deepseek"
    model: "deepseek-chat"  # 如果API支持v3，可以改为 "deepseek-chat-v3"
    api_key_env: "DEEPSEEK_API_KEY"
    base_url: "https://api.deepseek.com"
    params:
      temperature: 0.3
      max_tokens: 2000
  
  # 豆包 (Doubao) - 字节跳动大模型
  doubao:
    enabled: true
    provider: "doubao"
    model: "doubao-pro-32k"  # 可选: doubao-lite-4k, doubao-pro-32k, doubao-pro-128k
    api_key_env: "DOUBAO_API_KEY"
    base_url: "https://ark.cn-beijing.volces.com/api/v3"
    params:
      temperature: 0.3
      max_tokens: 2000
  
  # Claude (可选)
  # 通过OpenRouter调用（国内可用）
  claude:
    enabled: false
    provider: "claude"
    model: "anthropic/claude-3.5-haiku"  # OpenRouter模型ID，也可用 anthropic/claude-3.7-sonnet
    api_key_env: "OPENROUTER_API_KEY"  # 使用OpenRouter API密钥
    base_url: "https://openrouter.ai/api/v1"
    params:
      temperature: 0.3
      max_tokens: 500  # 降低以节省成本
      http_referer: "https://github.com/dd-Dog/Translator_online"
      x_title: "Translator Agent"

# 工作流Agent配置
# 免费模型配置（使用DeepSeek和Qwen）
workflow:
  planner:
    model: "deepseek"  # 使用DeepSeek作为Planner（免费）
  translator_a:
    model: "deepseek"  # 使用DeepSeek作为主译（免费）
  translator_b:
    model: "qwen"  # 使用Qwen作为对照译（免费额度）
  checker:
    model: "deepseek"  # 使用DeepSeek作为Checker（免费）
  stylist:
    model: "qwen"  # 使用Qwen作为Stylist（免费额度）
  aggregator:
    model: "deepseek"  # 使用DeepSeek作为Aggregator（免费）
  
  # 可选：使用不同模型组合
  # 方案1: 全部使用DeepSeek（最省钱）
  # planner: "deepseek"
  # translator_a: "deepseek"
  # translator_b: "deepseek"
  # checker: "deepseek"
  # stylist: "deepseek"
  # aggregator: "deepseek"
  
  # 方案2: DeepSeek + Qwen混合（推荐，平衡质量和成本）
  # planner: "deepseek"
  # translator_a: "deepseek"
  # translator_b: "qwen"
  # checker: "deepseek"
  # stylist: "qwen"
  # aggregator: "deepseek"
  
  # 方案3: 使用Qwen Plus（更高质量，但需要付费）
  # planner: "qwen_plus"
  # translator_a: "qwen_plus"
  # translator_b: "qwen_plus"
  # checker: "qwen_plus"
  # stylist: "qwen_plus"
  # aggregator: "qwen_plus"

# 风格配置
style:
  default: "general"  # general, academic, official, colloquial
  glossary: {}  # 术语表，格式：{原文: 统一术语}

# 模型优先级（用于加权策略，保留向后兼容）
model_weights:
  openai: 0.4
  gemini: 0.4
  qwen: 0.2

