# 大模型配置
models:
  # OpenAI (用于Planner, Checker, Aggregator)
  openai:
    enabled: true
    provider: "openai"
    model: "gpt-4"
    api_key_env: "OPENAI_API_KEY"
    base_url: null  # 使用默认，或自定义
    params:
      temperature: 0.3
      max_tokens: 2000
  
  # Gemini (用于Translator-A主译)
  # 通过OpenRouter调用（国内可用）
  gemini:
    enabled: true
    provider: "gemini"
    model: "google/gemini-2.5-flash"  # OpenRouter模型ID，也可用 google/gemini-2.5-pro
    api_key_env: "OPENROUTER_API_KEY"  # 使用OpenRouter API密钥
    base_url: "https://openrouter.ai/api/v1"
    use_openrouter: true
    params:
      temperature: 0.3
      http_referer: "https://github.com/dd-Dog/Translator_online"
      x_title: "Translator Agent"
  
  # Qwen (用于Translator-B对照译和Stylist)
  qwen:
    enabled: true
    provider: "qwen"
    model: "qwen-turbo"  # 或 qwen-plus, qwen-max
    api_key_env: "QWEN_API_KEY"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    params:
      temperature: 0.4
      max_tokens: 2000
  
  # DeepSeek (可选，用于Translator-B对照译和Stylist)
  deepseek:
    enabled: false
    provider: "deepseek"
    model: "deepseek-chat"
    api_key_env: "DEEPSEEK_API_KEY"
    base_url: "https://api.deepseek.com"
    params:
      temperature: 0.4
      max_tokens: 2000
  
  # Claude (可选)
  # 通过OpenRouter调用（国内可用）
  claude:
    enabled: false
    provider: "claude"
    model: "anthropic/claude-3.5-haiku"  # OpenRouter模型ID，也可用 anthropic/claude-3.7-sonnet
    api_key_env: "OPENROUTER_API_KEY"  # 使用OpenRouter API密钥
    base_url: "https://openrouter.ai/api/v1"
    params:
      temperature: 0.3
      max_tokens: 2000
      http_referer: "https://github.com/dd-Dog/Translator_online"
      x_title: "Translator Agent"

# 工作流Agent配置
workflow:
  planner:
    model: "openai"  # 使用OpenAI作为Planner
  translator_a:
    model: "gemini"  # 使用Gemini作为主译
  translator_b:
    model: "qwen"  # 使用Qwen作为对照译（或deepseek）
  checker:
    model: "openai"  # 使用OpenAI作为Checker
  stylist:
    model: "qwen"  # 使用Qwen作为Stylist（或deepseek）
  aggregator:
    model: "openai"  # 使用OpenAI作为Aggregator

# 风格配置
style:
  default: "general"  # general, academic, official, colloquial
  glossary: {}  # 术语表，格式：{原文: 统一术语}

# 模型优先级（用于加权策略，保留向后兼容）
model_weights:
  openai: 0.4
  gemini: 0.4
  qwen: 0.2

